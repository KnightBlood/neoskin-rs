name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.94.0"
  NODE_VERSION: "24"
  FRONTEND_REF: "v6.0.10_patch"

jobs:
  test:
    name: Format, clippy & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --tests

  platform:
    name: Platform (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, features: "", test_debug: "2" }
          # ARM runner 在编译本 crate 时多次被回收（疑似内存压力）。
          # 关闭 test 二进制的 debug info，显著降低 codegen/链接内存。
          - { os: ubuntu-24.04-arm, arch: arm64, features: "", cache_key: "arm64-v2", test_debug: "0" }
          - { os: windows-latest, arch: x64, features: "vendored-openssl", test_debug: "2" }
          - { os: windows-11-arm, arch: arm64, features: "vendored-openssl", test_debug: "2" }
          - { os: macos-15-intel, arch: x64, features: "", test_debug: "2" }
          - { os: macos-latest, arch: arm64, features: "", test_debug: "2" }
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          cache-on-failure: true
      - name: Test (system OpenSSL)
        if: matrix.features == ''
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --lib --tests
      - name: Test (vendored OpenSSL)
        if: matrix.features != ''
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --lib --tests --features ${{ matrix.features }}

  db-matrix:
    name: DB matrix (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.4
            port: 3306
            username: blessing
            password: "123456"
            health: "mysqladmin ping -h localhost -uroot -proot"
          - db: mariadb
            image: mariadb:11.8
            port: 3306
            username: blessing
            password: "123456"
            health: "healthcheck.sh --connect --innodb_initialized"
          - db: pgsql
            image: postgres:18
            port: 5432
            username: postgres
            password: "123456"
            health: "pg_isready -U postgres"
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blessing_skin
          MYSQL_USER: blessing
          MYSQL_PASSWORD: "123456"
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: blessing_skin
          MARIADB_USER: blessing
          MARIADB_PASSWORD: "123456"
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: blessing_skin
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: blessing_skin
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test db_matrix -- --nocapture

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev unzip
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test deps
        run: npm ci --prefix tests/browser
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRONTEND_REF" https://github.com/DreamCraft-Tech/blessing-skin-server-patch.git /tmp/bs-src
          corepack enable
          (cd /tmp/bs-src && yarn install --frozen-lockfile && yarn build)
          mkdir -p public
          rm -rf public/app
          cp -r /tmp/bs-src/public/app public/app
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Export Chrome path
        run: echo "NEOSKIN_CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --tests
      - name: Browser E2E
        env:
          NEOSKIN_BROWSER_E2E: "1"
        run: cargo test --test browser -- --nocapture
