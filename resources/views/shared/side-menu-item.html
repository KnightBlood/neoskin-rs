<li class="nav-item {{ item.classes|join(' ') }}">
  {% if item.children %}
    <a class="nav-link {% if item.active %}active{% endif %}" href="#">
      <i class="nav-icon fas {{ item.icon }}"></i>
      <p class="ml-1">{{ trans(item.title) }}</p>
      <i class="right fas fa-angle-left"></i>
    </a>
    <ul class="nav nav-treeview">
      {% for child in item.children %}
        {% with item = child %}
          {% include "shared/side-menu-item.html" %}
        {% endwith %}
      {% endfor %}
    </ul>
  {% else %}
    <a href="{{ url(item.link) }}" class="nav-link {% if item.active %}active{% endif %}"{% if item["new-tab"] %} target="_blank" rel="noopener noreferrer"{% endif %}>
      <i class="nav-icon {% if item.icon == 'fa-circle' %}far{% else %}fas{% endif %} {{ item.icon }}"></i>
      <p class="ml-1">{{ trans(item.title) }}</p>
    </a>
  {% endif %}
</li>
