<!DOCTYPE html>
<html lang="{{ locale }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="robots" content="noindex,nofollow">
    <title>{% block title %}{{ trans('setup.wizard.master.title') }}{% endblock %}</title>
    {% include "assets/spectre.html" ignore missing %}
    {% for style in styles %}
      <link rel="stylesheet" href="{{ style }}">
    {% endfor %}
  </head>

  <body class="bg-secondary">
    {% include "errors/languages.html" %}
    <div class="hero d-flex">
      <div class="hero-body">
        <h1 class="text-center">
          <a class="text-primary" href="https://github.com/bs-community/blessing-skin-server">
            NeoSkin
          </a>
        </h1>
        <div class="divider"></div>
        <h3>{{ self.subtitle() }}</h3>
        <div class="divider"></div>
        {% block content %}{% endblock %}
      </div>
    </div>
    {% for script in scripts %}
      <script src="{{ script }}"></script>
    {% endfor %}
  </body>
</html>
